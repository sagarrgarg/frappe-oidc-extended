[project]
name = "oidc_extended"
authors = [
    { name = "Mohammed Noureldin", email = "contact@mohammednoureldin.com"}
]
description = "An extension to the ERPNext Social Login authentication method (OIDC) that incorporates new features designed to meet the needs of enterprises."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # The id token is decoded and verified with PyJWT; the crypto extra provides the
    # RSA and ECDSA backends needed to check a signature against a JWKS endpoint.
    "PyJWT[crypto]>=2.4.0",
]

[tool.bench.frappe-dependencies]
# The callback uses frappe.utils.oauth.consume_oauth_state, which arrived in 15.116.0
# and 16.30.0. A single range cannot exclude 16.0.0 to 16.29.x, so the callback also
# checks at runtime and says which release is needed.
frappe = ">=15.116.0,<=17.0.0-dev"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
# Read statically from the module source: importing the app to learn its version
# fails under PEP 517 build isolation, where the source tree is not importable.
version = {attr = "oidc_extended.__version__"}

[tool.setuptools.packages.find]
include = ["oidc_extended", "oidc_extended.*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
